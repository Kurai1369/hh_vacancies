[tool.poetry]
name = "hh_vacancies"
version = "0.1.0"
description = "Курсовая: сбор вакансий hh.ru с сохранением в PostgreSQL"
authors = ["Анна Александрина <kurai@vk.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
requests = "^2.31.0"
psycopg2-binary = "^2.9.9"
python-dotenv = "^1.0.1"

[tool.poetry.group.dev.dependencies]
black = "^23.12.1"
flake8 = "^7.0.0"
isort = "^5.13.2"
mypy = "^1.8.0"
pytest = "^7.4.4"
pytest-cov = "^4.1.0"
flake8-pyproject = "^1.2.4"

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
exclude = ["venv", ".venv", "tests", "docs"]

[[tool.mypy.overrides]]
module = ["psycopg2.*", "requests.*", "dotenv.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503", "F821", "E501"]
